[package]
name = "payserver-plugin-api"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "The plugin manifest contract: parsing, id validation, and version negotiation, shared by the plugin host and plugins"

[dependencies]
# Default features off on purpose: this crate is compiled into wasm plugins,
# and `clock` is the part that needs a platform clock. Parsing and formatting
# are all that is wanted here.
chrono = { version = "0.4", default-features = false, features = [
  "serde",
  "alloc",
] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
utoipa = { version = "6", features = ["uuid", "chrono"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
openapi = ["utoipa"]
