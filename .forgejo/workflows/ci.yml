# THE FORGEJO COPY of .github/workflows/ci.yml. A COPY AND NOT A MOVE, for two
# reasons that are both one-way:
#
#   `uses:` carries a FULL URL for any action not published on code.forgejo.org.
#   Forgejo resolves a bare `owner/action` against its own registry, so
#   `dtolnay/rust-toolchain@stable` would not resolve here - and the full-URL form
#   is a form GitHub rejects. The two files cannot be the same bytes.
#
#   `runs-on: rcs-docker` names this forge's container runner. `ubuntu-latest` is
#   served here too, mapped to docker://node:22-bookworm, but every other port in
#   the fleet names rcs-docker and one spelling is easier to reason about than two.
#
# NOTHING IS DROPPED. Both jobs are ported: neither declares a service container
# and neither uploads artifacts, which are the two platform gaps that cost
# ethpayserver its `Test` and `E2E` jobs and payserver-billing three of six.
# commons is pure Rust with no fixtures, so it ports whole.
#
# THE POINT OF THE DIRECTORY, beyond running CI here: Forgejo reads
# .github/workflows only as a FALLBACK, when .forgejo/workflows is absent. With
# no directory here this repository's GitHub workflows were live on this forge
# naming `ubuntu-latest`, which nothing served until today - so runs queued and
# were evicted by the next push. Measured across the fleet 2026-10-20:
# ethpayserver 899 runs, 893 cancelled, zero successes. This directory is what
# takes that fallback away.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  verify:
    name: Verify
    runs-on: rcs-docker
    steps:
      - uses: actions/checkout@v4

      # This repository is public. A ticket id in a source file leaks the
      # title and shape of unreleased work, and an outside reader cannot open
      # the tracker anyway. Ticket ids belong in the commit message and PR
      # title, not the tree - see CLAUDE.md.
      - name: No ticket ids or tracker links in source
        run: ./scripts/check-no-ticket-refs.sh

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Format check
        run: cargo fmt --all -- --check

      # --all-features is the point of this step. ui-kit's `auth` feature is
      # optional, so a default build never compiles ui-kit/src/auth - login,
      # registration, recovery. That module was therefore never linted at all
      # and had accumulated 83 findings; three E0425s once reached a green PR
      # (2026-09-06), and a dead binding shipped green in #15. Both were
      # invisible to a clippy step that did not build the code.
      #
      # The backlog is cleared - 78 auto-fixed, 5 redundant locals by hand - so
      # this is one step that denies rustc AND clippy warnings across every
      # feature, instead of a lenient `check` beside a clippy run that skipped
      # half the crate.
      - name: Clippy (all features)
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --all-features here for the same reason as the clippy step above:
      # without it `cargo nextest run` never
      # builds ui-kit's `auth` module, so the registration-derivation tests in
      # register_page.rs would sit in the tree reading as coverage and never
      # execute. A test CI does not run is worse than a known gap.
      #
      # This makes the suite noticeably slower: the recovery round trips run
      # Argon2id at 64 MiB / t=3 unoptimised, twice per test. That cost is the
      # security property - do not lower the parameters to speed it up.
      - name: Tests (all features)
        run: cargo nextest run --workspace --lib --all-features --no-fail-fast

  # THE CONDITION IS ON THE STEPS, NOT THE JOB, and that is a Forgejo
  # difference rather than a style choice.
  #
  # With `if:` at JOB level and the condition false, this forge leaves the job's
  # commit status at `pending / Has started running` and never resolves it.
  # Measured on this PR: the RUN finished `success` while the Audit status stayed
  # pending indefinitely - and merge-pr.sh correctly refuses a queued check,
  # because a queued job is could-not-run and never a pass. So every pull request
  # here would have been blocked for ever by a job that was supposed to skip.
  #
  # (A job skipped because of `needs:` DOES resolve - ethpayserver's Audit reports
  # `success / Has been skipped` that way. It is the job-level `if` that hangs.)
  #
  # With the condition on each step, the job starts, its status resolves, and it
  # does nothing off main at the cost of one container start.
  audit:
    name: Audit
    runs-on: rcs-docker
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        if: github.ref == 'refs/heads/main'
      - name: Install cargo-audit
        if: github.ref == 'refs/heads/main'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        if: github.ref == 'refs/heads/main'
        run: cargo audit
        continue-on-error: true
