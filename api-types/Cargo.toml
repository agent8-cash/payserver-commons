[package]
name = "api-types"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "The PayServer HTTP contract: request and response shapes, shared by every server and the client"

[dependencies]
types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
# Pure-Rust SHA-256 and hex for the webhook idempotency key. Both are
# no_std-capable RustCrypto/companion crates with no C, no system entropy
# and no JS shim, so they build for wasm32-unknown-unknown unchanged - the
# constraint that rules out ring, openssl and the like in this crate.
sha2 = "0.10"
hex = "0.4"
utoipa = { version = "6", features = ["uuid", "chrono"], optional = true }

# WASM: `uuid` refuses to build for wasm32-unknown-unknown without an explicit
# randomness source. The `js` feature routes it to `crypto.getRandomValues`,
# same as crypto's getrandom entry - the client already supplies this via its
# own direct `uuid` dependency and feature unification, so this changes nothing
# it ships. It only makes `cargo check --target wasm32-unknown-unknown` on this
# crate alone tell you something real.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.11", features = ["js"] }

[features]
default = []
openapi = ["utoipa", "types/openapi"]

[dev-dependencies]
