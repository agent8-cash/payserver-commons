name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public. A ticket id in a source file leaks the
      # title and shape of unreleased work, and an outside reader cannot open
      # the tracker anyway. Ticket ids belong in the commit message and PR
      # title, not the tree - see CLAUDE.md.
      - name: No ticket ids or tracker links in source
        run: ./scripts/check-no-ticket-refs.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Format check
        run: cargo fmt --all -- --check

      # --all-features is the point of this step. ui-kit's `auth` feature is
      # optional, so a default build never compiles ui-kit/src/auth - login,
      # registration, recovery. That module was therefore never linted at all
      # and had accumulated 83 findings; three E0425s once reached a green PR
      # (2026-09-06), and a dead binding shipped green in #15. Both were
      # invisible to a clippy step that did not build the code.
      #
      # The backlog is cleared - 78 auto-fixed, 5 redundant locals by hand - so
      # this is one step that denies rustc AND clippy warnings across every
      # feature, instead of a lenient `check` beside a clippy run that skipped
      # half the crate.
      - name: Clippy (all features)
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --all-features here for the same reason as the clippy step above:
      # without it `cargo nextest run` never
      # builds ui-kit's `auth` module, so the registration-derivation tests in
      # register_page.rs would sit in the tree reading as coverage and never
      # execute. A test CI does not run is worse than a known gap.
      #
      # This makes the suite noticeably slower: the recovery round trips run
      # Argon2id at 64 MiB / t=3 unoptimised, twice per test. That cost is the
      # security property - do not lower the parameters to speed it up.
      #
      # No --lib: it would restrict the run to library unit tests and skip
      # every integration target, including the exchange-rate provider tests
      # that decide what amount an invoice asks for.
      - name: Tests (all features)
        run: cargo nextest run --workspace --all-features --no-fail-fast

      # A test binary that compiles and runs nothing reports success, so
      # assert the exchange-rate integration tests actually executed. When
      # adding or removing one, change EXPECTED to match.
      - name: Exchange-rate integration tests ran
        env:
          EXPECTED: "12"
        run: |
          cargo nextest run -p rates --all-features --test integration --no-fail-fast 2>&1 | tee nextest-rates.log
          grep -E "Summary.* ${EXPECTED} tests? run: ${EXPECTED} passed" nextest-rates.log

  audit:
    name: Audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        continue-on-error: true
